<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>737 Sky Escape</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    touch-action: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

/* =========================
   TOP BAR
========================= */

#topBar {
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;

    z-index: 5;

    display: flex;
    justify-content: space-between;
    align-items: center;

    pointer-events: none;
}

#scoreBox,
#coinBox {
    background: rgba(0,0,0,0.55);
    color: white;

    padding: 8px 14px;

    border-radius: 12px;

    font-size: 17px;
    font-weight: bold;
}

#rightUI {
    display: flex;
    gap: 8px;
    align-items: center;

    pointer-events: auto;
}

#shopButton {
    border: none;

    background: rgba(0,0,0,0.65);
    color: white;

    padding: 9px 13px;

    border-radius: 12px;

    font-size: 20px;

    cursor: pointer;
}

/* =========================
   MENU / GAME OVER
========================= */

#menu,
#gameOver {
    position: fixed;
    inset: 0;

    z-index: 10;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    background: rgba(0,0,0,0.30);
}

.menuBox {
    width: min(90%, 430px);

    padding: 28px;

    border-radius: 22px;

    background: rgba(255,255,255,0.95);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.35);
}

.menuBox h1 {
    font-size: 34px;
    margin-bottom: 10px;
}

.menuBox p {
    margin: 8px 0;
    color: #333;
}

.savedCoins {
    font-size: 20px;
    font-weight: bold;

    margin: 15px 0;
}

.menuButton {
    width: 100%;

    margin-top: 12px;

    padding: 14px;

    border: none;

    border-radius: 12px;

    background: #1976d2;
    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

.menuButton.shop {
    background: #333;
}

.menuButton.equipped {
    background: #2e7d32;
}

/* =========================
   SHOP
========================= */

#shopWindow {
    position: fixed;
    inset: 0;

    z-index: 20;

    display: none;

    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,0.68);
}

.shopBox {
    width: min(92%, 520px);
    max-height: 88vh;

    overflow-y: auto;

    background: #f4f4f4;

    border-radius: 22px;

    padding: 22px;

    box-shadow:
        0 10px 50px rgba(0,0,0,0.5);
}

.shopHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 15px;
}

.shopHeader h2 {
    font-size: 28px;
}

.closeShop {
    border: none;

    background: #d32f2f;
    color: white;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    font-size: 22px;

    cursor: pointer;
}

.shopCoins {
    background: #222;
    color: #ffd54f;

    padding: 10px;

    border-radius: 10px;

    margin-bottom: 18px;

    text-align: center;

    font-weight: bold;
}

.sectionTitle {
    font-size: 22px;
    font-weight: bold;

    margin: 15px 0 10px;
}

.skinCard {
    background: white;

    border: 2px solid #ccc;

    border-radius: 15px;

    padding: 14px;

    margin-bottom: 12px;

    text-align: center;
}

.skinCard h3 {
    margin-bottom: 10px;
    font-size: 21px;
}

.skinPreview {
    width: 100%;
    height: 140px;

    border-radius: 12px;

    background:
        linear-gradient(
            #79c8ff,
            #d9f2ff
        );

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    margin-bottom: 12px;
}

.skinPreview img {
    max-width: 92%;
    max-height: 120px;

    object-fit: contain;
}

.skinFallback {
    color: #555;
    font-weight: bold;
}

.equippedText {
    display: none;

    margin-top: 9px;

    color: #2e7d32;

    font-weight: bold;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls {
    position: fixed;

    bottom: 20px;

    left: 0;
    right: 0;

    z-index: 6;

    display: flex;

    justify-content: space-between;

    padding: 0 20px;

    pointer-events: none;
}

.controlButton {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    border: none;

    background: rgba(0,0,0,0.45);

    color: white;

    font-size: 28px;

    pointer-events: auto;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- =========================
     TOP UI
========================= -->

<div id="topBar">

    <div id="scoreBox">
        Score: 0
    </div>

    <div id="rightUI">

        <div id="coinBox">
            🪙 0
        </div>

        <button id="shopButton">
            🛒
        </button>

    </div>

</div>

<!-- =========================
     MAIN MENU
========================= -->

<div id="menu">

    <div class="menuBox">

        <h1>
            ✈️ 737 Sky Escape
        </h1>

        <p>
            Avoid the missiles and collect the coins!
        </p>

        <div class="savedCoins">
            🪙 Saved Coins:
            <span id="menuCoins">0</span>
        </div>

        <button
            class="menuButton"
            id="startButton">
            ▶ PLAY
        </button>

        <button
            class="menuButton shop"
            id="menuShopButton">
            🛒 SHOP
        </button>

    </div>

</div>

<!-- =========================
     GAME OVER
========================= -->

<div
    id="gameOver"
    style="display:none;">

    <div class="menuBox">

        <h1>
            GAME OVER
        </h1>

        <p>
            Score:
            <strong id="finalScore">0</strong>
        </p>

        <p>
            Coins this run:
            <strong id="runCoins">0</strong>
        </p>

        <div class="savedCoins">
            🪙 Total Saved Coins:
            <span id="gameOverCoins">0</span>
        </div>

        <button
            class="menuButton"
            id="restartButton">
            ▶ PLAY AGAIN
        </button>

        <button
            class="menuButton shop"
            id="gameOverShopButton">
            🛒 SHOP
        </button>

    </div>

</div>

<!-- =========================
     SHOP
========================= -->

<div id="shopWindow">

    <div class="shopBox">

        <div class="shopHeader">

            <h2>
                🛒 SHOP
            </h2>

            <button
                class="closeShop"
                id="closeShopButton">
                ×
            </button>

        </div>

        <div class="shopCoins">
            🪙 Saved Coins:
            <span id="shopCoins">0</span>
        </div>

        <div class="sectionTitle">
            ✈️ Planes
        </div>

        <div class="sectionTitle">
            737 Skins
        </div>

        <!-- =========================
             DEFAULT PLANE
        ========================= -->

        <div class="skinCard">

            <h3>
                Default 737
            </h3>

            <div class="skinPreview">

                <img
                    src="plane.png"
                    alt="Default 737"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='block';
                    "
                >

                <span
                    class="skinFallback"
                    style="display:none;">
                    plane.png not found
                </span>

            </div>

            <button
                class="menuButton"
                id="equipDefaultButton">

                EQUIP DEFAULT

            </button>

            <div
                class="equippedText"
                id="defaultEquippedText">

                ✓ EQUIPPED

            </div>

        </div>

        <!-- =========================
             SKIN1
        ========================= -->

        <div class="skinCard">

            <h3>
                Skin1
            </h3>

            <div class="skinPreview">

                <!--
                    YOUR FUTURE SKIN IMAGE

                    Upload:
                    skin1.png

                    to the same folder as index.html.
                -->

                <img
                    src="skin1.png"
                    alt="Skin1"
                    id="skin1Preview"
                    onerror="
                        this.style.display='none';
                        document.getElementById('skin1Fallback').style.display='block';
                    "
                >

                <span
                    id="skin1Fallback"
                    class="skinFallback"
                    style="display:none;">

                    Upload skin1.png

                </span>

            </div>

            <button
                class="menuButton"
                id="equipSkin1Button">

                EQUIP SKIN1

            </button>

            <div
                class="equippedText"
                id="skin1EquippedText">

                ✓ EQUIPPED

            </div>

        </div>

    </div>

</div>

<!-- =========================
     MOBILE CONTROLS
========================= -->

<div id="mobileControls">

    <button
        class="controlButton"
        id="upButton">
        ▲
    </button>

    <button
        class="controlButton"
        id="downButton">
        ▼
    </button>

</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");

let W =
    window.innerWidth;

let H =
    window.innerHeight;

canvas.width = W;
canvas.height = H;


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        W = window.innerWidth;
        H = window.innerHeight;

        canvas.width = W;
        canvas.height = H;

        if (
            plane.y >
            H - plane.height
        ) {

            plane.y =
                H - plane.height;
        }
    }
);


/* =====================================================
   IMAGES
===================================================== */

/*
    DEFAULT AIRCRAFT
*/
const planeImage =
    new Image();

planeImage.src =
    "plane.png";


/*
    SEPARATE SKIN1 AIRCRAFT

    This is NOT plane.png.
*/
const skin1Image =
    new Image();

skin1Image.src =
    "skin1.png";


/*
    MISSILE
*/
const missileImage =
    new Image();

missileImage.src =
    "missile.png";


/* =====================================================
   SKIN SYSTEM
===================================================== */

/*
    Possible values:

    "default"
    "skin1"
*/

let selectedSkin =
    localStorage.getItem(
        "selected737Skin"
    ) || "default";


function getSelectedPlaneImage() {

    if (
        selectedSkin === "skin1"
    ) {

        /*
            If skin1.png exists,
            use it.
        */

        if (
            skin1Image.complete &&
            skin1Image.naturalWidth > 0
        ) {

            return skin1Image;
        }

    }

    /*
        Otherwise use the default.
    */

    return planeImage;
}


/* =====================================================
   SAVED COINS
===================================================== */

let savedCoins =
    parseInt(
        localStorage.getItem(
            "skyEscapeCoins"
        ) || "0"
    );


function saveCoins() {

    localStorage.setItem(
        "skyEscapeCoins",
        savedCoins.toString()
    );
}


function updateSavedCoinUI() {

    document.getElementById(
        "menuCoins"
    ).textContent =
        savedCoins;

    document.getElementById(
        "gameOverCoins"
    ).textContent =
        savedCoins;

    document.getElementById(
        "shopCoins"
    ).textContent =
        savedCoins;

    document.getElementById(
        "coinBox"
    ).textContent =
        "🪙 " + savedCoins;
}


updateSavedCoinUI();


/* =====================================================
   PLANE
===================================================== */

const plane = {

    x: 90,

    y: 300,

    maxWidth: 150,

    maxHeight: 75,

    width: 150,

    height: 75,

    baseSpeed: 5.5,

    speed: 5.5
};


/*
    Keep aircraft proportions.
*/

function calculatePlaneSize() {

    const image =
        getSelectedPlaneImage();

    if (
        image.naturalWidth > 0 &&
        image.naturalHeight > 0
    ) {

        const ratio =
            image.naturalWidth /
            image.naturalHeight;

        plane.width =
            plane.maxWidth;

        plane.height =
            plane.width / ratio;

        if (
            plane.height >
            plane.maxHeight
        ) {

            plane.height =
                plane.maxHeight;

            plane.width =
                plane.height * ratio;
        }
    }
}


/*
    Recalculate when either
    aircraft image loads.
*/

planeImage.onload =
    calculatePlaneSize;

skin1Image.onload =
    calculatePlaneSize;


/* =====================================================
   GAME VARIABLES
===================================================== */

let score = 0;

let runCoins = 0;

let gameRunning = false;

let missiles = [];

let coins = [];

let clouds = [];

let frameCount = 0;


/* =====================================================
   DIFFICULTY
===================================================== */

/*
    Starts at 1.0.

    Maximum is 1.7.

    This gives gradual increases
    without making the game unfair.
*/

let gameSpeed = 1;

const maximumSpeed = 1.7;


/* =====================================================
   TIME OF DAY
===================================================== */

/*
    Day:
        30 seconds

    Afternoon:
        30 seconds

    Night:
        30 seconds

    Total:
        90 seconds

    Then the cycle repeats.
*/

let timeOfDayTimer = 0;

const dayLength =
    30 * 60;

const afternoonLength =
    30 * 60;

const nightLength =
    30 * 60;


function getTimeOfDay() {

    const cycleLength =
        dayLength +
        afternoonLength +
        nightLength;

    const t =
        timeOfDayTimer %
        cycleLength;

    if (
        t < dayLength
    ) {

        return "day";
    }

    if (
        t <
        dayLength +
        afternoonLength
    ) {

        return "afternoon";
    }

    return "night";
}


/* =====================================================
   SKY
===================================================== */

function drawSky() {

    const time =
        getTimeOfDay();

    let topColor;
    let bottomColor;


    if (
        time === "day"
    ) {

        topColor =
            "#4facfe";

        bottomColor =
            "#b9e7ff";

    }

    else if (
        time === "afternoon"
    ) {

        topColor =
            "#e78b61";

        bottomColor =
            "#ffd194";

    }

    else {

        topColor =
            "#07152f";

        bottomColor =
            "#1b3158";
    }


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        topColor
    );

    gradient.addColorStop(
        1,
        bottomColor
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    drawSunOrMoon(
        time
    );
}


/* =====================================================
   SUN / MOON
===================================================== */

function drawSunOrMoon(
    time
) {

    if (
        time === "day"
    ) {

        ctx.beginPath();

        ctx.arc(
            W - 100,
            100,
            42,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#fff4a3";

        ctx.fill();

    }

    else if (
        time === "afternoon"
    ) {

        ctx.beginPath();

        ctx.arc(
            W - 110,
            H * 0.30,
            38,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffcf66";

        ctx.fill();

    }

    else {

        ctx.beginPath();

        ctx.arc(
            W - 110,
            100,
            35,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#f4f1c9";

        ctx.fill();


        /*
            Stars
        */

        ctx.fillStyle =
            "rgba(255,255,255,0.8)";

        for (
            let i = 0;
            i < 30;
            i++
        ) {

            const x =
                (i * 97) % W;

            const y =
                (i * 53) %
                (H * 0.65);

            ctx.fillRect(
                x,
                y,
                2,
                2
            );
        }
    }
}


/* =====================================================
   CLOUDS
===================================================== */

function createCloud(
    x,
    y
) {

    return {

        x: x,

        y: y,

        size:
            30 +
            Math.random() * 35,

        speed:
            0.7 +
            Math.random() * 0.6
    };
}


function createClouds() {

    clouds = [];

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        clouds.push(
            createCloud(
                Math.random() * W,
                60 +
                Math.random() *
                H * 0.55
            )
        );
    }
}


function updateClouds() {

    for (
        const cloud of clouds
    ) {

        cloud.x -=
            cloud.speed *
            gameSpeed;

        if (
            cloud.x <
            -150
        ) {

            cloud.x =
                W + 100;

            cloud.y =
                50 +
                Math.random() *
                H * 0.55;
        }
    }
}


function drawCloud(
    cloud
) {

    const alpha =
        getTimeOfDay() === "night"
        ? 0.20
        : 0.65;

    ctx.fillStyle =
        `rgba(255,255,255,${alpha})`;

    ctx.beginPath();

    ctx.arc(
        cloud.x,
        cloud.y,
        cloud.size * 0.55,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cloud.x +
        cloud.size * 0.55,
        cloud.y - 10,
        cloud.size * 0.7,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cloud.x +
        cloud.size,
        cloud.y,
        cloud.size * 0.5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =====================================================
   MISSILES
===================================================== */

function getMissileSize() {

    let width = 75;

    let height = 35;


    if (
        missileImage.naturalWidth > 0 &&
        missileImage.naturalHeight > 0
    ) {

        const ratio =
            missileImage.naturalWidth /
            missileImage.naturalHeight;

        height =
            width / ratio;

        if (
            height > 45
        ) {

            height = 45;

            width =
                height * ratio;
        }
    }


    return {
        width,
        height
    };
}


function spawnMissile() {

    const size =
        getMissileSize();


    missiles.push({

        x:
            W + 80,

        y:
            50 +
            Math.random() *
            Math.max(
                50,
                H - 130
            ),

        width:
            size.width,

        height:
            size.height,

        speed:
            4.0 +
            Math.random() * 1.5
    });
}


function updateMissiles() {

    for (
        let i =
            missiles.length - 1;

        i >= 0;

        i--
    ) {

        const missile =
            missiles[i];

        missile.x -=
            missile.speed *
            gameSpeed;


        if (
            missile.x <
            -missile.width - 30
        ) {

            missiles.splice(
                i,
                1
            );
        }
    }
}


function drawMissile(
    missile
) {

    if (
        missileImage.complete &&
        missileImage.naturalWidth > 0
    ) {

        ctx.drawImage(

            missileImage,

            missile.x,

            missile.y,

            missile.width,

            missile.height
        );

    }

    else {

        ctx.fillStyle =
            "#555";

        ctx.fillRect(

            missile.x,

            missile.y,

            missile.width,

            missile.height
        );
    }
}


/* =====================================================
   COINS
===================================================== */

function spawnCoin() {

    coins.push({

        x:
            W + 40,

        y:
            60 +
            Math.random() *
            Math.max(
                50,
                H - 140
            ),

        radius:
            13,

        speed:
            3.0 +
            Math.random()
    });
}


function updateCoins() {

    for (
        let i =
            coins.length - 1;

        i >= 0;

        i--
    ) {

        const coin =
            coins[i];

        coin.x -=
            coin.speed *
            gameSpeed;


        if (
            coin.x <
            -40
        ) {

            coins.splice(
                i,
                1
            );
        }
    }
}


function drawCoin(
    coin
) {

    ctx.beginPath();

    ctx.arc(

        coin.x,

        coin.y,

        coin.radius,

        0,

        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffd700";

    ctx.fill();

    ctx.strokeStyle =
        "#b8860b";

    ctx.lineWidth =
        2;

    ctx.stroke();


    ctx.fillStyle =
        "#8b6508";

    ctx.font =
        "bold 14px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "$",
        coin.x,
        coin.y + 1
    );
}


/* =====================================================
   COLLISION
===================================================== */

function collision(
    a,
    b
) {

    const padding = 10;

    return (

        a.x + padding <
        b.x +
        b.width -
        padding &&

        a.x +
        a.width -
        padding >
        b.x +
        padding &&

        a.y + padding <
        b.y +
        b.height -
        padding &&

        a.y +
        a.height -
        padding >
        b.y +
        padding
    );
}


function collectCoin(
    coin
) {

    const dx =
        plane.x +
        plane.width / 2 -
        coin.x;

    const dy =
        plane.y +
        plane.height / 2 -
        coin.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    return (
        distance <
        coin.radius +
        Math.min(
            plane.width,
            plane.height
        ) * 0.35
    );
}


/* =====================================================
   DIFFICULTY
===================================================== */

function updateDifficulty() {

    /*
        Every 10 seconds:

        speed increases by only 0.08.

        Maximum:
        1.7x

        This makes the game gradually
        harder without becoming extreme.
    */

    if (
        frameCount > 0 &&
        frameCount % 600 === 0
    ) {

        gameSpeed +=
            0.08;

        if (
            gameSpeed >
            maximumSpeed
        ) {

            gameSpeed =
                maximumSpeed;
        }
    }


    /*
        Plane movement speed increases
        more gently than missile speed.
    */

    plane.speed =
        plane.baseSpeed *
        (
            1 +
            (gameSpeed - 1) *
            0.45
        );
}


/* =====================================================
   PLANE CONTROL
===================================================== */

let movingUp =
    false;

let movingDown =
    false;


function updatePlane() {

    if (
        movingUp
    ) {

        plane.y -=
            plane.speed;
    }


    if (
        movingDown
    ) {

        plane.y +=
            plane.speed;
    }


    if (
        plane.y < 0
    ) {

        plane.y = 0;
    }


    if (
        plane.y >
        H - plane.height
    ) {

        plane.y =
            H - plane.height;
    }
}


/* =====================================================
   DRAW PLANE
===================================================== */

function drawPlane() {

    /*
        IMPORTANT:

        If Skin1 is equipped,
        this uses skin1.png.

        It does NOT use plane.png.
    */

    const image =
        getSelectedPlaneImage();


    if (
        image.complete &&
        image.naturalWidth > 0
    ) {

        ctx.drawImage(

            image,

            plane.x,

            plane.y,

            plane.width,

            plane.height
        );

    }

    else {

        ctx.fillStyle =
            "white";

        ctx.fillRect(

            plane.x,

            plane.y,

            plane.width,

            plane.height
        );
    }
}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    score = 0;

    runCoins = 0;

    frameCount = 0;

    gameSpeed = 1;

    timeOfDayTimer = 0;


    missiles = [];

    coins = [];


    plane.y =
        H / 2 -
        plane.height / 2;


    plane.speed =
        plane.baseSpeed;


    /*
        Recalculate the selected
        aircraft size.
    */

    calculatePlaneSize();


    gameRunning =
        true;


    updateSavedCoinUI();


    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

    gameRunning =
        false;


    document.getElementById(
        "finalScore"
    ).textContent =
        Math.floor(score);


    document.getElementById(
        "runCoins"
    ).textContent =
        runCoins;


    document.getElementById(
        "gameOverCoins"
    ).textContent =
        savedCoins;


    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";
}


/* =====================================================
   SHOP
===================================================== */

let shopWasRunning =
    false;


function openShop() {

    /*
        Remember whether the game
        was running.
    */

    shopWasRunning =
        gameRunning;


    gameRunning =
        false;


    document.getElementById(
        "shopWindow"
    ).style.display =
        "flex";


    updateSavedCoinUI();

    updateSkinUI();
}


function closeShop() {

    document.getElementById(
        "shopWindow"
    ).style.display =
        "none";


    /*
        Resume only if the shop
        was opened during gameplay.
    */

    if (
        shopWasRunning
    ) {

        gameRunning =
            true;

        requestAnimationFrame(
            gameLoop
        );
    }


    shopWasRunning =
        false;
}


/* =====================================================
   EQUIP DEFAULT
===================================================== */

function equipDefault() {

    selectedSkin =
        "default";


    localStorage.setItem(
        "selected737Skin",
        "default"
    );


    calculatePlaneSize();

    updateSkinUI();
}


/* =====================================================
   EQUIP SKIN1
===================================================== */

function equipSkin1() {

    /*
        Make sure the actual
        skin1.png exists.
    */

    if (
        !skin1Image.complete ||
        skin1Image.naturalWidth <= 0
    ) {

        alert(
            "Please upload skin1.png to the same folder as index.html first."
        );

        return;
    }


    selectedSkin =
        "skin1";


    localStorage.setItem(
        "selected737Skin",
        "skin1"
    );


    /*
        Recalculate dimensions
        using Skin1's actual
        aspect ratio.
    */

    calculatePlaneSize();

    updateSkinUI();
}


/* =====================================================
   UPDATE SHOP UI
===================================================== */

function updateSkinUI() {

    const defaultButton =
        document.getElementById(
            "equipDefaultButton"
        );

    const skin1Button =
        document.getElementById(
            "equipSkin1Button"
        );

    const defaultText =
        document.getElementById(
            "defaultEquippedText"
        );

    const skin1Text =
        document.getElementById(
            "skin1EquippedText"
        );


    /*
        DEFAULT
    */

    if (
        selectedSkin ===
        "default"
    ) {

        defaultButton.textContent =
            "✓ EQUIPPED";

        defaultButton.classList.add(
            "equipped"
        );

        defaultText.style.display =
            "block";

    }

    else {

        defaultButton.textContent =
            "EQUIP DEFAULT";

        defaultButton.classList.remove(
            "equipped"
        );

        defaultText.style.display =
            "none";
    }


    /*
        SKIN1
    */

    if (
        selectedSkin ===
        "skin1"
    ) {

        skin1Button.textContent =
            "✓ EQUIPPED";

        skin1Button.classList.add(
            "equipped"
        );

        skin1Text.style.display =
            "block";

    }

    else {

        skin1Button.textContent =
            "EQUIP SKIN1";

        skin1Button.classList.remove(
            "equipped"
        );

        skin1Text.style.display =
            "none";
    }
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    if (
        !gameRunning
    ) {

        return;
    }


    frameCount++;

    timeOfDayTimer++;


    /*
        Score slowly increases.
    */

    score +=
        0.1;


    /*
        Update difficulty.
    */

    updateDifficulty();


    /*
        Draw background.
    */

    drawSky();


    /*
        Plane.
    */

    updatePlane();


    /*
        Clouds.
    */

    updateClouds();


    for (
        const cloud of clouds
    ) {

        drawCloud(
            cloud
        );
    }


    /*
        Missile spawn rate.

        Starts around every 2 seconds.

        Later becomes more frequent,
        but is capped.
    */

    const missileSpawnRate =
        Math.max(

            65,

            120 -
            Math.floor(
                (gameSpeed - 1) *
                25
            )
        );


    if (
        frameCount %
        missileSpawnRate ===
        0
    ) {

        spawnMissile();
    }


    /*
        Coins.
    */

    if (
        frameCount %
        90 ===
        0
    ) {

        spawnCoin();
    }


    /*
        Update objects.
    */

    updateMissiles();

    updateCoins();


    /*
        MISSILES
    */

    for (
        const missile of missiles
    ) {

        drawMissile(
            missile
        );


        if (
            collision(
                plane,
                missile
            )
        ) {

            endGame();

            return;
        }
    }


    /*
        COINS
    */

    for (
        let i =
            coins.length - 1;

        i >= 0;

        i--
    ) {

        const coin =
            coins[i];


        drawCoin(
            coin
        );


        if (
            collectCoin(
                coin
            )
        ) {

            coins.splice(
                i,
                1
            );


            runCoins++;

            savedCoins++;


            saveCoins();

            updateSavedCoinUI();
        }
    }


    /*
        DRAW AIRCRAFT LAST
        so it stays visible.
    */

    drawPlane();


    /*
        TIME INDICATOR
    */

    const currentTime =
        getTimeOfDay();


    ctx.fillStyle =
        "rgba(0,0,0,0.35)";

    ctx.font =
        "bold 14px Arial";

    ctx.textAlign =
        "center";


    ctx.fillText(

        currentTime.toUpperCase(),

        W / 2,

        28
    );


    /*
        Continue.
    */

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   INITIAL CLOUDS
===================================================== */

createClouds();


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key ===
            "ArrowUp"
        ) {

            movingUp =
                true;

            event.preventDefault();
        }


        if (
            event.key ===
            "ArrowDown"
        ) {

            movingDown =
                true;

            event.preventDefault();
        }
    }
);


window.addEventListener(
    "keyup",
    (event) => {

        if (
            event.key ===
            "ArrowUp"
        ) {

            movingUp =
                false;
        }


        if (
            event.key ===
            "ArrowDown"
        ) {

            movingDown =
                false;
        }
    }
);


/* =====================================================
   MOBILE CONTROLS
===================================================== */

const upButton =
    document.getElementById(
        "upButton"
    );

const downButton =
    document.getElementById(
        "downButton"
    );


function pressUp(e) {

    e.preventDefault();

    movingUp =
        true;
}


function releaseUp(e) {

    e.preventDefault();

    movingUp =
        false;
}


function pressDown(e) {

    e.preventDefault();

    movingDown =
        true;
}


function releaseDown(e) {

    e.preventDefault();

    movingDown =
        false;
}


upButton.addEventListener(
    "pointerdown",
    pressUp
);

upButton.addEventListener(
    "pointerup",
    releaseUp
);

upButton.addEventListener(
    "pointercancel",
    releaseUp
);

upButton.addEventListener(
    "pointerleave",
    releaseUp
);


downButton.addEventListener(
    "pointerdown",
    pressDown
);

downButton.addEventListener(
    "pointerup",
    releaseDown
);

downButton.addEventListener(
    "pointercancel",
    releaseDown
);

downButton.addEventListener(
    "pointerleave",
    releaseDown
);


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    startGame
);


/*
    MAIN MENU SHOP
*/

document.getElementById(
    "menuShopButton"
).addEventListener(
    "click",
    openShop
);


/*
    TOP SHOP
*/

document.getElementById(
    "shopButton"
).addEventListener(
    "click",
    openShop
);


/*
    GAME OVER SHOP
*/

document.getElementById(
    "gameOverShopButton"
).addEventListener(
    "click",
    openShop
);


/*
    CLOSE SHOP
*/

document.getElementById(
    "closeShopButton"
).addEventListener(
    "click",
    closeShop
);


/*
    EQUIP DEFAULT
*/

document.getElementById(
    "equipDefaultButton"
).addEventListener(
    "click",
    equipDefault
);


/*
    EQUIP SKIN1
*/

document.getElementById(
    "equipSkin1Button"
).addEventListener(
    "click",
    equipSkin1
);


/* =====================================================
   INITIAL SHOP STATE
===================================================== */

updateSkinUI();

updateSavedCoinUI();

</script>
