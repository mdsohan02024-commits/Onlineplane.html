<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>737 Sky Escape</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #87ceeb;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* TOP INFORMATION */

#topBar {

    position: fixed;

    top: 10px;
    left: 10px;
    right: 10px;

    display: flex;
    justify-content: space-between;

    z-index: 10;

    pointer-events: none;
}

.info {

    background: white;

    border: 2px solid black;

    border-radius: 8px;

    padding: 8px 12px;

    font-size: 17px;

    font-weight: bold;
}


/* START SCREEN */

#startScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: rgba(255,255,255,0.35);

    z-index: 20;
}

.panel {

    width: 90%;

    max-width: 420px;

    padding: 25px;

    background: white;

    border: 3px solid black;

    border-radius: 15px;

    text-align: center;
}

.panel h1 {

    margin-top: 0;

    font-size: 30px;
}

.panel p {

    font-size: 17px;

    line-height: 1.5;
}

.startButton {

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border: 2px solid black;

    border-radius: 8px;

    background: green;

    color: black;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;
}


/* GAME OVER */

#gameOver {

    display: none;

    position: fixed;

    inset: 0;

    align-items: center;

    justify-content: center;

    background: rgba(255,255,255,0.4);

    z-index: 20;
}


/* MOBILE CONTROLS */

#controls {

    position: fixed;

    bottom: 20px;

    left: 0;

    right: 0;

    display: none;

    justify-content: space-between;

    padding: 0 25px;

    z-index: 15;

    pointer-events: none;
}

.controlButton {

    width: 75px;

    height: 65px;

    border: 2px solid black;

    border-radius: 12px;

    background: white;

    font-size: 30px;

    pointer-events: auto;

    touch-action: none;
}

</style>

</head>

<body>


<canvas id="gameCanvas"></canvas>


<!-- SCORE -->

<div id="topBar">

    <div class="info">

        Score:
        <span id="score">0</span>

    </div>


    <div class="info">

        🪙 Coins:
        <span id="coinCount">0</span>

    </div>

</div>


<!-- MOBILE CONTROLS -->

<div id="controls">

    <button
        class="controlButton"
        id="upButton">

        ⬆️

    </button>


    <button
        class="controlButton"
        id="downButton">

        ⬇️

    </button>

</div>


<!-- START -->

<div id="startScreen">

    <div class="panel">

        <h1>
            ✈️ 737 SKY ESCAPE
        </h1>

        <p>

            Fly the Boeing 737,
            avoid the missiles,
            collect coins and survive
            as long as possible.

        </p>

        <p>

            Use
            <strong>⬆️ UP</strong>
            and
            <strong>⬇️ DOWN</strong>
            arrows.

        </p>

        <button
            class="startButton"
            onclick="startGame()">

            START GAME

        </button>

    </div>

</div>


<!-- GAME OVER -->

<div id="gameOver">

    <div class="panel">

        <h1>
            💥 GAME OVER
        </h1>

        <p>

            Score:
            <strong id="finalScore">
                0
            </strong>

        </p>

        <p>

            Coins:
            <strong id="finalCoins">
                0
            </strong>

        </p>

        <button
            class="startButton"
            onclick="startGame()">

            PLAY AGAIN

        </button>

    </div>

</div>


<script>

/* ==============================
   CANVAS
============================== */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* ==============================
   GAME VARIABLES
============================== */

let gameRunning = false;

let score = 0;

let collectedCoins = 0;

let missiles = [];

let coins = [];

let clouds = [];


/* ==============================
   PLANE
============================== */

const plane = {

    x: 100,

    y: 300,

    width: 105,

    height: 48,

    speed: 6

};


/* ==============================
   CONTROLS
============================== */

let movingUp = false;

let movingDown = false;


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowUp") {

            movingUp = true;

        }

        if (event.key === "ArrowDown") {

            movingDown = true;

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (event.key === "ArrowUp") {

            movingUp = false;

        }

        if (event.key === "ArrowDown") {

            movingDown = false;

        }

    }
);


/* ==============================
   MOBILE BUTTONS
============================== */

const upButton =
    document.getElementById("upButton");

const downButton =
    document.getElementById("downButton");


function startUp(e) {

    e.preventDefault();

    movingUp = true;

}


function stopUp(e) {

    e.preventDefault();

    movingUp = false;

}


function startDown(e) {

    e.preventDefault();

    movingDown = true;

}


function stopDown(e) {

    e.preventDefault();

    movingDown = false;

}


upButton.addEventListener(
    "pointerdown",
    startUp
);

upButton.addEventListener(
    "pointerup",
    stopUp
);

upButton.addEventListener(
    "pointercancel",
    stopUp
);

upButton.addEventListener(
    "pointerleave",
    stopUp
);


downButton.addEventListener(
    "pointerdown",
    startDown
);

downButton.addEventListener(
    "pointerup",
    stopDown
);

downButton.addEventListener(
    "pointercancel",
    stopDown
);

downButton.addEventListener(
    "pointerleave",
    stopDown
);


/* ==============================
   START GAME
============================== */

function startGame() {

    score = 0;

    collectedCoins = 0;

    missiles = [];

    coins = [];

    clouds = [];


    plane.y =
        canvas.height / 2;


    gameRunning = true;


    document.getElementById(
        "startScreen"
    ).style.display = "none";


    document.getElementById(
        "gameOver"
    ).style.display = "none";


    document.getElementById(
        "controls"
    ).style.display = "flex";


    updateScore();


    requestAnimationFrame(gameLoop);

}


/* ==============================
   GAME LOOP
============================== */

function gameLoop() {

    if (!gameRunning) {

        return;

    }


    updateGame();

    drawGame();


    requestAnimationFrame(
        gameLoop
    );

}


/* ==============================
   UPDATE GAME
============================== */

function updateGame() {


    /* PLANE MOVEMENT */

    if (movingUp) {

        plane.y -= plane.speed;

    }


    if (movingDown) {

        plane.y += plane.speed;

    }


    /* KEEP PLANE INSIDE SCREEN */

    if (plane.y < 20) {

        plane.y = 20;

    }


    if (
        plane.y >
        canvas.height -
        plane.height -
        20
    ) {

        plane.y =
            canvas.height -
            plane.height -
            20;

    }


    /* ==========================
       CLOUD GENERATION
    ========================== */

    if (
        Math.random() < 0.025
    ) {

        clouds.push({

            x: canvas.width + 100,

            y:
                30 +
                Math.random() *
                (canvas.height - 100),

            size:
                25 +
                Math.random() * 35,

            speed:
                1 +
                Math.random() * 1.5

        });

    }


    clouds.forEach(
        function(cloud) {

            cloud.x -= cloud.speed;

        }
    );


    clouds =
        clouds.filter(
            function(cloud) {

                return cloud.x > -150;

            }
        );


    /* ==========================
       MISSILES
    ========================== */

    if (
        Math.random() < 0.014
    ) {

        missiles.push({

            x: canvas.width + 60,

            y:
                30 +
                Math.random() *
                (canvas.height - 80),

            width: 65,

            height: 22,

            speed:
                4 +
                Math.random() * 3

        });

    }


    missiles.forEach(
        function(missile) {

            missile.x -=
                missile.speed;

        }
    );


    missiles =
        missiles.filter(
            function(missile) {

                return missile.x > -100;

            }
        );


    /* ==========================
       COINS
    ========================== */

    if (
        Math.random() < 0.02
    ) {

        coins.push({

            x: canvas.width + 40,

            y:
                40 +
                Math.random() *
                (canvas.height - 100),

            radius: 13,

            speed: 3

        });

    }


    coins.forEach(
        function(coin) {

            coin.x -=
                coin.speed;

        }
    );


    coins =
        coins.filter(
            function(coin) {

                return coin.x > -50;

            }
        );


    /* ==========================
       MISSILE COLLISION
    ========================== */

    for (
        let i = 0;
        i < missiles.length;
        i++
    ) {

        if (
            rectangleCollision(
                plane,
                missiles[i]
            )
        ) {

            endGame();

            return;

        }

    }


    /* ==========================
       COIN COLLECTION
    ========================== */

    for (
        let i = coins.length - 1;
        i >= 0;
        i--
    ) {

        if (
            coinCollision(
                plane,
                coins[i]
            )
        ) {

            collectedCoins++;

            score += 25;

            coins.splice(i, 1);

        }

    }


    /* SURVIVAL SCORE */

    score++;

    updateScore();

}


/* ==============================
   DRAW GAME
============================== */

function drawGame() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* SKY */

    ctx.fillStyle =
        "#87CEEB";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* CLOUDS */

    clouds.forEach(
        function(cloud) {

            drawCloud(
                cloud.x,
                cloud.y,
                cloud.size
            );

        }
    );


    /* COINS */

    coins.forEach(
        function(coin) {

            drawCoin(coin);

        }
    );


    /* MISSILES */

    missiles.forEach(
        function(missile) {

            drawMissile(
                missile
            );

        }
    );


    /* PLANE */

    drawPlane();

}


/* ==============================
   DRAW BOEING 737
============================== */

function drawPlane() {

    ctx.save();


    ctx.translate(
        plane.x,
        plane.y
    );


    /*
       MAIN BODY
    */

    ctx.fillStyle =
        "white";

    ctx.strokeStyle =
        "black";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.ellipse(
        52,
        24,
        50,
        14,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.stroke();


    /*
       ETIHAD-STYLE GOLD/YELLOW
       DECORATIVE STRIPE
    */

    ctx.strokeStyle =
        "#c7a44a";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(
        15,
        27
    );

    ctx.lineTo(
        88,
        27
    );

    ctx.stroke();


    /*
       WINGS
    */

    ctx.fillStyle =
        "#eeeeee";

    ctx.strokeStyle =
        "black";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.moveTo(
        48,
        20
    );

    ctx.lineTo(
        18,
        2
    );

    ctx.lineTo(
        34,
        23
    );

    ctx.lineTo(
        18,
        45
    );

    ctx.lineTo(
        48,
        28
    );

    ctx.closePath();

    ctx.fill();

    ctx.stroke();


    /*
       TAIL
    */

    ctx.beginPath();

    ctx.moveTo(
        85,
        20
    );

    ctx.lineTo(
        102,
        3
    );

    ctx.lineTo(
        97,
        25
    );

    ctx.closePath();

    ctx.fill();

    ctx.stroke();


    /*
       COCKPIT
    */

    ctx.fillStyle =
        "#222";

    ctx.beginPath();

    ctx.ellipse(
        90,
        19,
        7,
        4,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       WINDOWS
    */

    ctx.fillStyle =
        "#222";


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        ctx.beginPath();

        ctx.arc(
            47 + i * 7,
            19,
            2,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /*
       ENGINE 1
    */

    ctx.fillStyle =
        "#777";

    ctx.beginPath();

    ctx.ellipse(
        40,
        35,
        10,
        6,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.stroke();


    /*
       ENGINE 2
    */

    ctx.beginPath();

    ctx.ellipse(
        62,
        35,
        10,
        6,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.stroke();


    ctx.restore();

}


/* ==============================
   CLOUD
============================== */

function drawCloud(
    x,
    y,
    size
) {

    ctx.fillStyle =
        "white";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size * 0.45,
        0,
        Math.PI * 2
    );


    ctx.arc(
        x + size * 0.45,
        y - size * 0.15,
        size * 0.6,
        0,
        Math.PI * 2
    );


    ctx.arc(
        x + size * 0.95,
        y,
        size * 0.45,
        0,
        Math.PI * 2
    );


    ctx.fill();

}


/* ==============================
   COIN
============================== */

function drawCoin(coin) {

    ctx.beginPath();

    ctx.arc(
        coin.x,
        coin.y,
        coin.radius,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "gold";

    ctx.fill();


    ctx.strokeStyle =
        "black";

    ctx.lineWidth = 2;

    ctx.stroke();


    ctx.fillStyle =
        "black";

    ctx.font =
        "bold 15px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "$",
        coin.x,
        coin.y
    );

}


/* ==============================
   MISSILE
============================== */

function drawMissile(
    missile
) {

    ctx.save();


    ctx.translate(
        missile.x,
        missile.y
    );


    /*
       BODY
    */

    ctx.fillStyle =
        "#555";

    ctx.strokeStyle =
        "black";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.moveTo(
        0,
        11
    );

    ctx.lineTo(
        48,
        3
    );

    ctx.lineTo(
        65,
        11
    );

    ctx.lineTo(
        48,
        19
    );

    ctx.closePath();

    ctx.fill();

    ctx.stroke();


    /*
       MISSILE FIN
    */

    ctx.beginPath();

    ctx.moveTo(
        25,
        5
    );

    ctx.lineTo(
        15,
        -7
    );

    ctx.lineTo(
        35,
        5
    );

    ctx.closePath();

    ctx.fill();

    ctx.stroke();


    /*
       FIRE
    */

    ctx.fillStyle =
        "orange";


    ctx.beginPath();

    ctx.moveTo(
        0,
        6
    );

    ctx.lineTo(
        -18,
        11
    );

    ctx.lineTo(
        0,
        16
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* ==============================
   COLLISION
============================== */

function rectangleCollision(
    a,
    b
) {

    return (

        a.x <
        b.x + b.width &&

        a.x + a.width >
        b.x &&

        a.y <
        b.y + b.height &&

        a.y + a.height >
        b.y

    );

}


/* ==============================
   COIN COLLISION
============================== */

function coinCollision(
    rect,
    coin
) {

    const closestX =
        Math.max(
            rect.x,
            Math.min(
                coin.x,
                rect.x + rect.width
            )
        );


    const closestY =
        Math.max(
            rect.y,
            Math.min(
                coin.y,
                rect.y + rect.height
            )
        );


    const dx =
        coin.x - closestX;

    const dy =
        coin.y - closestY;


    return (
        dx * dx +
        dy * dy
    ) <
    coin.radius *
    coin.radius;

}


/* ==============================
   GAME OVER
============================== */

function endGame() {

    gameRunning = false;

    movingUp = false;

    movingDown = false;


    document.getElementById(
        "controls"
    ).style.display = "none";


    document.getElementById(
        "finalScore"
    ).textContent =
        score;


    document.getElementById(
        "finalCoins"
    ).textContent =
        collectedCoins;


    document.getElementById(
        "gameOver"
    ).style.display = "flex";

}


/* ==============================
   SCORE
============================== */

function updateScore() {

    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "coinCount"
    ).textContent =
        collectedCoins;

}

</script>

</body>
</html>
